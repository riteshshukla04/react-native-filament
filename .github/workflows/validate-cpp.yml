name: Validate C++

on:
  pull_request:
    paths:
      - '.github/workflows/validate-cpp.yml'
      - 'packages/react-native-filament/cpp/**'
      - 'packages/react-native-filament/android/src/main/cpp/**'
      - 'packages/react-native-filament/ios/**'
      - 'packages/react-native-filament-physics/cpp/**'
      - 'packages/react-native-filament-physics/android/src/main/cpp/**'

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        working-directory: packages/react-native-filament
        run: |
          files=$(git ls-files 'cpp/**/*.cpp' 'cpp/**/*.hpp' 'cpp/*.cpp' 'cpp/*.hpp' 'android/src/main/cpp/*.cpp' 'ios/*.mm' ':!:cpp/materials/*Package.hpp')
          [ -z "$files" ] || clang-format --dry-run --Werror $files
      - name: Check formatting of react-native-filament-physics
        working-directory: packages/react-native-filament-physics
        run: clang-format --dry-run --Werror $(git ls-files 'cpp/*.cpp' 'cpp/*.hpp' 'android/src/main/cpp/*.cpp')
